<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" width="360" height="520">
  <defs>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#E8C97A" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#C9A84C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F5CBA7"/>
      <stop offset="100%" stop-color="#E8A070"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C0392B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C0392B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer golden halo -->
  <ellipse cx="180" cy="230" rx="160" ry="210" fill="url(#halo)"/>
  <ellipse cx="180" cy="200" rx="130" ry="130" fill="url(#glow)"/>

  <!-- ══ CROWN (Mukut) ══ -->
  <!-- Crown base band -->
  <rect x="112" y="112" width="136" height="12" rx="6" fill="#C9A84C"/>
  <rect x="108" y="108" width="144" height="8" rx="4" fill="#E8C97A"/>
  <!-- Crown arch panels -->
  <path d="M120 112 L115 70 Q118 62 125 68 L132 108" fill="#C9A84C"/>
  <path d="M155 112 L148 55 Q152 44 158 50 L168 108" fill="#C9A84C"/>
  <path d="M180 112 L175 40 Q180 28 185 40 L192 108" fill="#C9A84C"/>
  <path d="M205 112 L214 50 Q220 44 224 55 L217 108" fill="#C9A84C"/>
  <path d="M240 112 L248 68 Q255 62 258 70 L253 112" fill="#C9A84C"/>
  <!-- Crown gems -->
  <circle cx="180" cy="34" r="8" fill="#C0392B"/>
  <circle cx="180" cy="34" r="5" fill="#E74C3C" opacity="0.7"/>
  <circle cx="153" cy="50" r="5" fill="#8B1A1A"/>
  <circle cx="207" cy="50" r="5" fill="#8B1A1A"/>
  <circle cx="122" cy="68" r="4" fill="#C9A84C"/>
  <circle cx="238" cy="68" r="4" fill="#C9A84C"/>
  <!-- Crown decorative arcs -->
  <path d="M112 112 Q135 90 158 112" stroke="#E8C97A" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M158 112 Q180 86 202 112" stroke="#E8C97A" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M202 112 Q225 90 248 112" stroke="#E8C97A" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- ══ FACE ══ -->
  <ellipse cx="180" cy="200" rx="62" ry="74" fill="url(#skin)" filter="url(#soft)"/>
  <!-- Face outline glow -->
  <ellipse cx="180" cy="200" rx="62" ry="74" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.4"/>

  <!-- Third eye / forehead mark -->
  <ellipse cx="180" cy="152" rx="10" ry="5.5" fill="#C0392B"/>
  <ellipse cx="180" cy="152" rx="6" ry="3" fill="#8B0000" opacity="0.7"/>
  <!-- Tilak line -->
  <path d="M174 146 Q180 143 186 146" stroke="#C0392B" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M138 170 Q155 162 172 170" stroke="#4E342E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M188 170 Q205 162 222 170" stroke="#4E342E" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes (large, beautiful) -->
  <ellipse cx="153" cy="183" rx="18" ry="11" fill="white"/>
  <ellipse cx="207" cy="183" rx="18" ry="11" fill="white"/>
  <!-- Iris -->
  <ellipse cx="153" cy="183" rx="10" ry="9" fill="#1A3A6B" opacity="0.85"/>
  <ellipse cx="207" cy="183" rx="10" ry="9" fill="#1A3A6B" opacity="0.85"/>
  <!-- Pupil -->
  <circle cx="153" cy="183" r="6" fill="#0A0A0A"/>
  <circle cx="207" cy="183" r="6" fill="#0A0A0A"/>
  <!-- Eye highlights -->
  <circle cx="157" cy="179" r="3.5" fill="white" opacity="0.9"/>
  <circle cx="211" cy="179" r="3.5" fill="white" opacity="0.9"/>
  <!-- Eyeliner -->
  <path d="M135 183 Q153 196 171 183" stroke="#1A0000" stroke-width="1.5" fill="none"/>
  <path d="M189 183 Q207 196 225 183" stroke="#1A0000" stroke-width="1.5" fill="none"/>
  <!-- Upper lashes -->
  <path d="M135 183 Q153 170 171 183" stroke="#1A0000" stroke-width="2.5" fill="none"/>
  <path d="M189 183 Q207 170 225 183" stroke="#1A0000" stroke-width="2.5" fill="none"/>

  <!-- Nose -->
  <path d="M175 210 Q180 220 185 210" stroke="#C09A7A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="170" cy="213" r="2.5" fill="#D4A574" opacity="0.5"/>
  <circle cx="190" cy="213" r="2.5" fill="#D4A574" opacity="0.5"/>

  <!-- Lips -->
  <path d="M156 238 Q180 252 204 238" fill="#C0392B"/>
  <path d="M156 238 Q180 232 204 238" fill="#8B1A1A" opacity="0.8"/>
  <path d="M165 243 Q180 248 195 243" stroke="#E07070" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- ══ HAIR & ORNAMENTS ══ -->
  <!-- Left hair -->
  <path d="M118 150 Q95 180 100 240" stroke="#3E2723" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M118 150 Q92 185 98 245" stroke="#5D4037" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Right hair -->
  <path d="M242 150 Q265 180 260 240" stroke="#3E2723" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M242 150 Q268 185 262 245" stroke="#5D4037" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Hair top bun -->
  <ellipse cx="180" cy="126" rx="28" ry="16" fill="#3E2723"/>
  <ellipse cx="180" cy="124" rx="20" ry="10" fill="#5D4037" opacity="0.5"/>

  <!-- Earrings -->
  <circle cx="100" cy="210" r="8" fill="#C9A84C"/>
  <circle cx="260" cy="210" r="8" fill="#C9A84C"/>
  <circle cx="100" cy="210" r="4.5" fill="#E64A19"/>
  <circle cx="260" cy="210" r="4.5" fill="#E64A19"/>
  <!-- Earring drop -->
  <ellipse cx="100" cy="224" rx="4" ry="7" fill="#C9A84C"/>
  <ellipse cx="260" cy="224" rx="4" ry="7" fill="#C9A84C"/>

  <!-- Necklace -->
  <path d="M118 270 Q180 295 242 270" stroke="#C9A84C" stroke-width="4" fill="none"/>
  <path d="M125 275 Q180 302 235 275" stroke="#E8C97A" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Necklace gems -->
  <circle cx="180" cy="296" r="7" fill="#C0392B"/>
  <circle cx="155" cy="290" r="4.5" fill="#C9A84C"/>
  <circle cx="205" cy="290" r="4.5" fill="#C9A84C"/>

  <!-- ══ BODY ══ -->
  <!-- Torso/sari (red) -->
  <path d="M118 280 Q118 380 118 420 Q180 440 242 420 Q242 380 242 280 Q210 300 180 298 Q150 300 118 280Z" fill="#8B1A1A"/>
  <!-- Sari gold border -->
  <path d="M118 280 Q150 300 180 298 Q210 300 242 280" stroke="#C9A84C" stroke-width="3" fill="none"/>
  <path d="M118 420 Q180 440 242 420" stroke="#C9A84C" stroke-width="3" fill="none"/>
  <!-- Sari drape highlight -->
  <path d="M155 298 Q175 320 195 298" stroke="#C9A84C" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- ══ ARMS (10 arms — simplified stylized) ══ -->
  <!-- Main two arms holding trident (trishul) -->
  <path d="M118 300 Q80 270 60 250" stroke="#E8A070" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M242 300 Q280 270 300 250" stroke="#E8A070" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Upper left arms -->
  <path d="M120 285 Q75 240 58 200" stroke="#E8A070" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M120 270 Q82 215 72 170" stroke="#E8A070" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M128 260 Q95 200 92 150" stroke="#E8A070" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Upper right arms -->
  <path d="M240 285 Q285 240 302 200" stroke="#E8A070" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M240 270 Q278 215 288 170" stroke="#E8A070" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M232 260 Q265 200 268 150" stroke="#E8A070" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Lower left arm (blessing) -->
  <path d="M118 320 Q88 350 75 380" stroke="#E8A070" stroke-width="11" fill="none" stroke-linecap="round"/>
  <!-- Lower right arm (Sudarshana Chakra) -->
  <path d="M242 320 Q272 350 285 380" stroke="#E8A070" stroke-width="11" fill="none" stroke-linecap="round"/>

  <!-- Weapons/symbols in hands -->
  <!-- Trishul (top right hand) -->
  <path d="M268 150 L268 110 M262 120 L268 110 L274 120 M265 115 L268 110 L271 115" stroke="#C9A84C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Lotus (top left hand) -->
  <circle cx="92" cy="150" r="8" fill="#FF8FAB" opacity="0.85"/>
  <circle cx="92" cy="150" r="5" fill="#FFCDD2" opacity="0.7"/>
  <!-- Conch / Shankha (mid right) -->
  <path d="M288 170 Q296 163 300 170 Q302 178 296 182 Q290 185 286 180 Q284 174 288 170Z" fill="#FFFFF0" stroke="#C9A84C" stroke-width="1.2"/>
  <!-- Chakra (mid left) -->
  <circle cx="72" cy="170" r="10" fill="none" stroke="#C9A84C" stroke-width="2.5"/>
  <circle cx="72" cy="170" r="5" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <line x1="72" y1="160" x2="72" y2="180" stroke="#C9A84C" stroke-width="1.5"/>
  <line x1="62" y1="170" x2="82" y2="170" stroke="#C9A84C" stroke-width="1.5"/>
  <!-- Sword (lower left) -->
  <path d="M58 200 L48 250 L52 252 L62 202" fill="#C9A84C" opacity="0.8"/>
  <!-- Bow (lower right) -->
  <path d="M302 200 Q320 230 302 260" stroke="#C9A84C" stroke-width="2.5" fill="none"/>
  <line x1="302" y1="200" x2="302" y2="260" stroke="#8B4513" stroke-width="1.5"/>
  <!-- Blessing hand (bottom left) -->
  <circle cx="75" cy="382" r="12" fill="#E8A070" opacity="0.7"/>
  <!-- Chakra (bottom right) -->
  <circle cx="285" cy="382" r="10" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <circle cx="285" cy="382" r="5" fill="#C9A84C" opacity="0.6"/>

  <!-- ══ LION (Vahana) ══ -->
  <ellipse cx="180" cy="460" rx="75" ry="35" fill="#E8A070" opacity="0.7"/>
  <ellipse cx="130" cy="458" rx="30" ry="22" fill="#D4900C" opacity="0.6"/>
  <circle cx="118" cy="445" r="18" fill="#E07830" opacity="0.7"/>
  <circle cx="118" cy="445" r="12" fill="#C9A84C" opacity="0.5"/>

  <!-- Base golden glow line -->
  <ellipse cx="180" cy="490" rx="110" ry="15" fill="#C9A84C" opacity="0.3"/>

  <!-- Overall prabha (outer ring of light) -->
  <circle cx="180" cy="175" r="155" fill="none" stroke="#E8C97A" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.35"/>
  <circle cx="180" cy="175" r="162" fill="none" stroke="#C9A84C" stroke-width="1" stroke-dasharray="3,12" opacity="0.2"/>
</svg>
