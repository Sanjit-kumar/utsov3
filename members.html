<!DOCTYPE html>

<meta charset="UTF-8">

<title>UTSOV 2026 — Members Directory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=EB+Garamond:ital@0;1&family=Josefin+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --red-dark:#5C0000; --red:#8B1A1A; --gold:#C9A84C; --gold-lt:#E8C97A; --marigold:#FF9933;
  --cream:#FFFDF8; --ink:#2A1000; --ink-soft:#6B5A4A; --border:#E8D9C0;
  --f-display:'Bebas Neue',sans-serif; --f-serif:'EB Garamond',serif; --f-label:'Josefin Sans',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-label)}

.hero{position:relative;background:radial-gradient(ellipse 100% 80% at 50% 0%,rgba(130,15,15,.72) 0%,transparent 65%),radial-gradient(ellipse 80% 50% at 50% 110%,rgba(25,0,0,.75) 0%,transparent 55%),#2C0808;padding:3rem 1.25rem 2.3rem;text-align:center}
.hero-eyebrow{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-lt);margin-bottom:.6rem}
.hero h1{font-family:var(--f-display);color:#fff;font-size:clamp(2rem,7vw,3rem);letter-spacing:.04em;margin:0;text-shadow:0 4px 20px rgba(0,0,0,.4)}
.hero p.sub{font-family:var(--f-serif);font-style:italic;color:var(--gold-lt);margin:.4rem 0 0;font-size:1rem}

.wrap{max-width:980px;margin:0 auto;padding:1.8rem 1.25rem 3rem}

.search-box{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:1rem 1.2rem;margin-bottom:1.3rem;box-shadow:0 8px 28px rgba(92,0,0,.07)}
.search-box input{width:100%;padding:.75rem .9rem;border:1.5px solid var(--border);border-radius:10px;font-size:1rem;font-family:var(--f-label)}
.search-box input:focus{outline:2px solid var(--gold);border-color:var(--gold)}

.count-line{font-size:.78rem;color:var(--ink-soft);margin:0 0 .8rem .2rem}

.member-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:#fff;border:1.5px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(92,0,0,.06)}
.member-row{display:flex;align-items:center;gap:.9rem;padding:.8rem 1.2rem;border-bottom:1px solid var(--border);transition:background .15s}
.member-row:last-child{border-bottom:none}
.member-row:hover{background:#FFF8F0}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-label);font-weight:700;font-size:.85rem;color:#fff;flex-shrink:0;background:var(--red)}
.m-info{min-width:0;text-align:left}
.m-name{font-weight:700;font-size:.92rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-name.unnamed{color:var(--ink-soft);font-style:italic;font-weight:400}
.empty-state{text-align:center;color:var(--ink-soft);padding:2rem 0;font-style:italic}

footer{text-align:center;font-size:.72rem;color:var(--ink-soft);padding:0 1.25rem 2rem}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-eyebrow">UTSOV Durga Puja 2026</div>
  <h1>Members Directory</h1>
  <p class="sub">The UTSOV - Members WhatsApp group, at a glance</p>
</div>

<div class="wrap">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Search by name…" autocomplete="off">
  </div>
  <p class="count-line" id="countLine"></p>
  <ul class="member-list" id="memberList"></ul>
  <p class="empty-state" id="emptyState" hidden>No matching members.</p>
</div>

<footer>UTSOV Inc. &middot; Internal page, not linked from the public site</footer>

function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function initials(name) {
  if (!name) return '?';
  var parts = name.trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function avatarColor(name) {
  var palette = ['#8B1A1A', '#C9A84C', '#5C0000', '#B8860B', '#6B3FA0', '#1D6FA5', '#A3134F', '#2E7D32'];
  var hash = 0;
  for (var i = 0; i < (name || '').length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return palette[hash % palette.length];
}

function render() {
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var filtered = q
    ? MEMBERS.filter(function(m) { return m.name.toLowerCase().indexOf(q) !== -1; })
    : MEMBERS;

  var listEl = document.getElementById('memberList');
  var emptyEl = document.getElementById('emptyState');
  var countEl = document.getElementById('countLine');

  countEl.textContent = filtered.length + ' of ' + MEMBERS.length + ' member' + (MEMBERS.length === 1 ? '' : 's');
  emptyEl.hidden = filtered.length > 0;
  listEl.innerHTML = '';

  filtered.forEach(function(m) {
    var li = document.createElement('li');
    li.className = 'member-row';
    var displayName = m.name || 'Name not on file';
    li.innerHTML =
      '<div class="avatar" style="background:' + avatarColor(m.name || m.phone) + '">' + initials(m.name) + '</div>' +
      '<div class="m-info">' +
        '<span class="m-name' + (m.name ? '' : ' unnamed') + '">' + escapeHtml(displayName) + '</span>' +
      '</div>';
    listEl.appendChild(li);
  });
}

document.getElementById('searchInput').addEventListener('input', render);
render();
</script>
