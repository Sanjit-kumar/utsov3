<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>UTSOV 2026 — Door Check-In</title>
<meta name="robots" content="noindex, nofollow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red-dark:#6B0E0E;--red:#9E2424;--cream:#FFFDF8;--ivory:#FFF0E5;
  --green:#1F8A3B;--green-bg:#E7F6EC;--amber:#6D4C2F;--amber-bg:#EFE4D8;
  --on-cream:#1A0000;--line:#eadbd0;
  /* Day-type colors — a separate visual channel from check-in status (green=full, brown=partial,
     gray=none above), so "which day" and "how checked-in" never fight for the same color. */
  --sat:#0D1F6B;--sun:#A3134F;--both:#C25B00;
}
body{font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--on-cream);min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

header{background:var(--red-dark);color:#fff;padding:.8rem 1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;position:sticky;top:0;z-index:20}
header .title{font-weight:700;font-size:1rem}
header .stats{font-size:.76rem;opacity:.95;text-align:right;line-height:1.3}

.day-tabs{display:flex;background:var(--red-dark);padding:0 1rem .6rem;gap:.4rem;position:sticky;top:48px;z-index:20}
.day-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.5rem;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:rgba(255,255,255,.85);border-radius:8px}
.day-tab .tab-main{font-weight:700;font-size:.85rem}
.day-tab .tab-sub{font-weight:600;font-size:.68rem;opacity:.85}
.day-tab.active{background:#fff;color:var(--red-dark);border-color:#fff}
.day-tab.active .tab-sub{opacity:.7}

/* Color-key strip — explains the day-pill colors to whoever sits down at this page fresh */
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1rem;padding:.55rem 1rem;background:#fff;border-bottom:1px solid var(--line);font-size:.72rem;color:#666;align-items:center}
.legend b{color:#444;font-weight:700}
.legend .lg-item{display:flex;align-items:center;gap:.3rem;white-space:nowrap}
.legend .lg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

.station-bar{background:var(--ivory);padding:.6rem 1rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.station-bar label{font-size:.8rem;font-weight:600}
.station-bar input{padding:.4rem .6rem;border:1px solid #ccc;border-radius:6px;font-size:.85rem;flex:1;min-width:140px}

.toolbar{display:flex;gap:.6rem;padding:.8rem 1rem;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:98px;z-index:19;flex-wrap:wrap}
#searchInput{flex:1;min-width:160px;padding:.7rem .9rem;border:1.5px solid #ccc;border-radius:10px;font-size:1rem}
#searchInput:focus{outline:2px solid var(--red-dark);border-color:var(--red-dark)}
#qrToggleBtn{padding:.7rem 1rem;background:var(--red-dark);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:.9rem;white-space:nowrap}
#qrToggleBtn.active{background:var(--amber)}

main{flex:1;max-width:640px;margin:0 auto;width:100%;padding:0 1rem 2rem}

/* Camera panel — shown only while scanning */
#cameraPanel{display:none;padding-top:1rem}
#cameraPanel.show{display:block}
.camera-wrap{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;max-width:380px;margin:0 auto}
.camera-wrap video{width:100%;height:100%;object-fit:cover}
.camera-wrap .scan-box{position:absolute;top:15%;left:15%;right:15%;bottom:15%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
.camera-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:1rem;font-size:.9rem;background:rgba(0,0,0,.6)}
.camera-close{display:block;margin:.6rem auto 0;padding:.5rem 1.1rem;background:#eee;border:none;border-radius:8px;font-size:.85rem;font-weight:600}

.manual-row{display:flex;gap:.5rem;padding:.7rem 0 0}
.manual-row input{flex:1;padding:.6rem;border:1.5px solid #ccc;border-radius:8px;font-size:.95rem}
.manual-row button{padding:.6rem 1rem;background:#eee;color:#333;border:none;border-radius:8px;font-weight:700;font-size:.85rem}

.error-banner{display:none;background:#FFF0F0;border:2px solid var(--red);color:var(--red-dark);padding:.8rem;border-radius:10px;font-size:.9rem;text-align:center;margin-top:.8rem}
.error-banner.show{display:block}
.success-flash{display:none;background:var(--green-bg);border:2px solid var(--green);color:var(--green);padding:.9rem;border-radius:10px;text-align:center;font-weight:700;margin-top:.8rem}
.success-flash.show{display:block}

.list-count{font-size:.78rem;color:#888;padding:.8rem 0 .4rem}

/* Roster rows */
.roster{display:flex;flex-direction:column;gap:.5rem;padding-bottom:1rem}
.row{background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.row.status-full{border-color:var(--green)}
.row.status-partial{border-color:var(--amber)}
/* Left stripe = which day(s); card border above = check-in progress. Two independent signals,
   so these rules must come after .status-full/.status-partial to win on just the left edge. */
.row.day-sat{border-left:5px solid var(--sat)}
.row.day-sun{border-left:5px solid var(--sun)}
.row.day-both{border-left:5px solid var(--both)}

.row-head{display:flex;align-items:flex-start;gap:.6rem;padding:.75rem .9rem;cursor:pointer}
.row-chevron{color:#bbb;font-size:.8rem;transition:transform .15s;margin-top:.25rem}
.row.open .row-chevron{transform:rotate(90deg)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:.35rem}
.row-line1{display:flex;align-items:center;gap:.5rem}
.row-name{flex:1;min-width:0;font-weight:700;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-line2{display:flex;align-items:center;gap:.55rem;font-size:.78rem;color:#888;flex-wrap:wrap}

.day-pill{font-size:.63rem;font-weight:800;letter-spacing:.04em;padding:.26rem .55rem;border-radius:999px;white-space:nowrap;flex-shrink:0;color:#fff}
.day-pill.sat{background:var(--sat)}
.day-pill.sun{background:var(--sun)}
.day-pill.both{background:var(--both)}

/* Payment source — how this registration was paid for (PayPal/website, Zelle, Sulekha), so
   whoever's at the door can sanity-check a manual Zelle/Sulekha entry if something looks off. */
.pay-badge{font-size:.6rem;font-weight:700;letter-spacing:.03em;padding:.2rem .5rem;border-radius:999px;white-space:nowrap;flex-shrink:0;border:1.5px solid}
.pay-badge.paypal{color:#0E7C86;border-color:#0E7C86;background:#E3F3F4}
.pay-badge.zelle{color:#6D1ED4;border-color:#6D1ED4;background:#F1E7FB}
.pay-badge.sulekha{color:#475569;border-color:#475569;background:#EAEDF1}

.dot-row{display:flex;gap:3px;align-items:center;flex-shrink:0}
.dot{width:9px;height:9px;border-radius:50%;background:#e2e2e2;flex-shrink:0}
.dot.filled{background:var(--green)}
.dot-more{font-size:.68rem;color:#999}

.row-badge{font-size:.66rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:.3rem .6rem;border-radius:999px;white-space:nowrap;flex-shrink:0}
.row-badge.none{background:#eee;color:#777}
.row-badge.partial{background:var(--amber-bg);color:var(--amber)}
.row-badge.full{background:var(--green);color:#fff}
.gift-badge{font-size:.85rem;flex-shrink:0}
.gift-badge.pending{opacity:.25;filter:grayscale(1)}

.row-detail{display:none;padding:0 .9rem .9rem;border-top:1px solid var(--line)}
.row.open .row-detail{display:block}
.row-detail .loading{padding:.8rem 0;font-size:.85rem;color:#999;text-align:center}
.detail-card{padding-top:.7rem}
.checkin-day-note{font-size:.72rem;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.4rem}
.detail-head{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.detail-card>.dot-row{margin:0 0 .6rem;gap:4px}
.detail-card>.dot-row .dot{width:11px;height:11px}
.result-row{font-size:.9rem;margin:.3rem 0;display:flex;justify-content:space-between;gap:.5rem}
.result-row b{font-weight:600}
.detail-status{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:.3rem .6rem;border-radius:8px;display:inline-flex;align-items:center;gap:.4rem}
.detail-status.full{background:var(--green-bg);color:var(--green)}
.detail-status.partial{background:var(--amber-bg);color:var(--amber)}
.detail-status.none{background:#eee;color:#777}
.detail-status.problem{background:#FFF0F0;color:var(--red)}

.attendee-check-list{margin-top:.7rem;padding-top:.6rem;border-top:1px solid rgba(0,0,0,.08)}
.attendee-check-row{display:flex;align-items:center;gap:.6rem;padding:.5rem .2rem;border-radius:8px}
.attendee-check-row:active{background:#f6f6f6}
.attendee-check-row input[type=checkbox]{width:22px;height:22px;flex-shrink:0;accent-color:var(--green)}
.attendee-check-row .ac-name{flex:1;font-size:.9rem;font-weight:600}
.attendee-check-row .ac-food{font-size:.76rem;color:#888}

.detail-actions{display:flex;gap:.6rem;margin-top:.9rem}
.detail-actions button{flex:1;padding:.75rem;border:none;border-radius:8px;font-weight:700;font-size:.92rem}
.btn-confirm{background:var(--green);color:#fff}
.btn-confirm:disabled{background:#aaa;cursor:not-allowed}
.btn-cancel{background:#eee;color:#333}

/* Gift section — deliberately styled distinct from the per-day check-in list above it, since
   it's a different kind of state: one shared flag for the whole registration, any day. */
.gift-section{margin-top:1rem;padding-top:.9rem;border-top:2px dashed var(--line)}
.gift-head{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#999;margin-bottom:.1rem}
.gift-sub{font-size:.72rem;color:#aaa;margin-bottom:.6rem}
.gift-btn{width:100%;padding:.85rem;border-radius:10px;border:2px solid #ddd;background:#fafafa;color:#555;font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:.5rem}
.gift-btn.given{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.gift-meta{font-size:.74rem;color:#999;text-align:center;margin-top:.45rem}

.empty-state{text-align:center;color:#999;padding:2rem 0;font-size:.9rem}
</style>
</head>
<body>

<header>
  <div class="title">🎟 UTSOV Door Check-In</div>
  <div class="stats" id="statsLine">Loading…</div>
</header>

<div class="day-tabs">
  <button class="day-tab" id="tabSaturday" onclick="selectDay('saturday')">
    <span class="tab-main">Saturday, Oct 17</span>
    <span class="tab-sub" id="tabSatStats">…</span>
  </button>
  <button class="day-tab" id="tabSunday" onclick="selectDay('sunday')">
    <span class="tab-main">Sunday, Oct 18</span>
    <span class="tab-sub" id="tabSunStats">…</span>
  </button>
</div>

<div class="station-bar">
  <label for="stationName">Gate / Volunteer:</label>
  <input type="text" id="stationName" placeholder="e.g. Front Gate - Ranjan" maxlength="100">
</div>

<div class="legend">
  <b>Day:</b>
  <span class="lg-item"><span class="lg-dot" style="background:var(--sat)"></span>Saturday only</span>
  <span class="lg-item"><span class="lg-dot" style="background:var(--sun)"></span>Sunday only</span>
  <span class="lg-item"><span class="lg-dot" style="background:var(--both)"></span>Both Days</span>
  <b style="margin-left:.4rem">In:</b>
  <span class="lg-item"><span class="lg-dot" style="background:var(--green)"></span>All checked in</span>
  <span class="lg-item"><span class="lg-dot" style="background:var(--amber)"></span>Partial</span>
  <span class="lg-item"><span class="lg-dot" style="background:#ccc"></span>Not yet</span>
</div>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="🔍 Search by name…" autocomplete="off">
  <button id="qrToggleBtn" type="button" onclick="toggleCamera()">📷 Scan QR</button>
</div>

<main>
  <div id="cameraPanel">
    <div class="camera-wrap" id="cameraWrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="scan-box" id="scanBox"></div>
      <div class="camera-msg" id="cameraMsg" style="display:none"></div>
    </div>
    <canvas id="canvas" style="display:none"></canvas>
    <button class="camera-close" onclick="toggleCamera()">✕ Close Scanner</button>

    <div class="manual-row">
      <input type="number" id="manualIdInput" placeholder="Can't scan? Enter registration ID" min="1">
      <button onclick="manualLookup()">Look Up</button>
    </div>
  </div>

  <div class="error-banner" id="errorBanner"></div>
  <div class="success-flash" id="successFlash"></div>

  <div class="list-count" id="listCount"></div>
  <div class="roster" id="rosterList"></div>
  <div class="empty-state" id="emptyState" hidden>No matching registrations.</div>
</main>

<script src="js/jsQR.js"></script>
<script>
// ── API helper ────────────────────────────────────────────────────────────────
function apiCall(action, extra) {
  var body = Object.assign({ action: action }, extra || {});
  return fetch('api/checkin.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r) { return r.json(); }).catch(function() {
    return { err: 'Network error — check connection and try again.' };
  });
}

function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ── Day tab state ─────────────────────────────────────────────────────────────
// A "Both Days" registration appears on BOTH tabs, but Saturday and Sunday check-in are
// tracked completely independently server-side — marking someone present on Saturday has
// zero effect on their Sunday status. Needed for accurate per-day headcounts (catering,
// gifts, etc.) since a Both-Days pass holder might only actually show up on one of the days.
var currentDay = 'saturday';

function selectDay(day) {
  currentDay = day;
  openRowId = null; // close any open detail panel — it belongs to the day we're leaving
  document.getElementById('tabSaturday').classList.toggle('active', day === 'saturday');
  document.getElementById('tabSunday').classList.toggle('active', day === 'sunday');
  renderRoster();
  refreshStats();
}

function rosterMatchesDay(r) {
  return r.days === 'Both Days' || r.days === (currentDay === 'saturday' ? 'Saturday' : 'Sunday');
}

// ── Day-color + partial-fill visual helpers ──────────────────────────────────
// 'days' comes in two formats depending on which API action supplied it — the roster list
// uses bare "Saturday"/"Sunday"/"Both Days", but lookup/confirm return the fuller
// "Saturday, Oct 17" / "Both Days (Oct 17 & 18)" (nicer for the detail view's "Days" row).
// Match by substring, not exact equality, so both forms resolve to the same color.
function dayClass(days) {
  if (!days) return 'both';
  if (days.indexOf('Both') !== -1) return 'both';
  if (days.indexOf('Saturday') !== -1) return 'sat';
  if (days.indexOf('Sunday') !== -1) return 'sun';
  return 'both';
}
function dayPillText(days) {
  var c = dayClass(days);
  return c === 'both' ? 'BOTH' : c === 'sat' ? 'SAT' : 'SUN';
}

// Cache/roster keys for the day currently selected.
function dayKey(day) { return day === 'sunday' ? 'sun' : 'sat'; }
function cacheKey(id, day) { return id + '|' + day; }

function payBadgeHtml(source) {
  var cls = source === 'Zelle' ? 'zelle' : source === 'Sulekha' ? 'sulekha' : 'paypal';
  return '<span class="pay-badge ' + cls + '">' + escapeHtml(source) + '</span>';
}

// Small filled/hollow dot row so "2 of 5 checked in" reads at a glance without doing math.
function dotsHtml(checkedIn, qty) {
  var MAX = 8;
  var show = Math.min(qty, MAX);
  var filled = Math.min(checkedIn, show);
  var html = '';
  for (var i = 0; i < show; i++) html += '<span class="dot' + (i < filled ? ' filled' : '') + '"></span>';
  if (qty > MAX) html += '<span class="dot-more">+' + (qty - MAX) + '</span>';
  return '<span class="dot-row">' + html + '</span>';
}

// Per-day running totals, computed client-side from the already-loaded roster — no extra API
// call. Each row carries independent .sat and .sun counts, so this reads the right one.
function computeDayStats(dayLabel) {
  var key = dayLabel === 'Saturday' ? 'sat' : 'sun';
  var total = 0, checked = 0;
  roster.forEach(function(r) {
    if (r.days === 'Both Days' || r.days === dayLabel) { total += r.qty; checked += r[key].checkedInCount; }
  });
  return { total: total, checked: checked };
}

function updateDayTabStats() {
  var sat = computeDayStats('Saturday'), sun = computeDayStats('Sunday');
  document.getElementById('tabSatStats').textContent = sat.checked + ' / ' + sat.total + ' in';
  document.getElementById('tabSunStats').textContent = sun.checked + ' / ' + sun.total + ' in';
}

// ── Roster state ──────────────────────────────────────────────────────────────
var roster = [];        // full list from server: {id, name, qty, days, checkedInCount, checkInStatus}
var openRowId = null;   // currently expanded registration id

function loadRoster() {
  return apiCall('roster', {}).then(function(d) {
    if (d.err) return;
    roster = d.roster || [];
    updateDayTabStats();
    renderRoster();
  });
}

function refreshStats() {
  apiCall('list', { day: currentDay }).then(function(d) {
    if (d.err) return;
    var dayName = currentDay === 'saturday' ? 'Saturday' : 'Sunday';
    document.getElementById('statsLine').textContent =
      d.fullyCheckedIn + ' fully in · ' + d.partiallyCheckedIn + ' partial · ' +
      d.checkedInHeadcount + ' / ' + d.totalHeadcount + ' people — ' + dayName;
  });
}

// Cache of the last-known full registration object per id, keyed by id. Kept in sync with
// any unsaved checkbox edits the volunteer has made in the currently-open row, so a
// background poll (loadRoster every 30s) can rebuild the list without silently discarding
// ticks nobody has hit "Save Check-In" on yet.
var detailCache = {};

function captureOpenRowEdits() {
  if (openRowId === null) return;
  var key = cacheKey(openRowId, currentDay);
  if (!detailCache[key]) return;
  var container = document.getElementById('checks-' + openRowId);
  if (!container) return;
  var boxes = container.querySelectorAll('input[type=checkbox]');
  boxes.forEach(function(b) {
    var idx = parseInt(b.dataset.idx, 10);
    if (detailCache[key].attendees[idx]) {
      detailCache[key].attendees[idx].checkedIn = b.checked;
    }
  });
}

function renderRoster() {
  captureOpenRowEdits(); // preserve any unsaved ticks before the DOM gets rebuilt below

  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var dayFiltered = roster.filter(rosterMatchesDay);
  var filtered = q ? dayFiltered.filter(function(r) { return r.name.toLowerCase().indexOf(q) !== -1; }) : dayFiltered;

  var listEl = document.getElementById('rosterList');
  var emptyEl = document.getElementById('emptyState');
  var countEl = document.getElementById('listCount');

  countEl.textContent = (q ? (filtered.length + ' match' + (filtered.length === 1 ? '' : 'es')) : (filtered.length + ' registrations')) +
    ' — ' + (currentDay === 'saturday' ? 'Saturday, Oct 17' : 'Sunday, Oct 18');
  emptyEl.hidden = filtered.length > 0;
  listEl.innerHTML = '';

  filtered.forEach(function(r) {
    var rs = r[dayKey(currentDay)]; // this day's independent {checkedInCount, checkInStatus}
    var row = document.createElement('div');
    row.className = 'row status-' + rs.checkInStatus + ' day-' + dayClass(r.days) + (openRowId === r.id ? ' open' : '');
    row.dataset.id = r.id;
    var badgeText = rs.checkInStatus === 'full' ? '✓ All In' : rs.checkInStatus === 'partial' ? (rs.checkedInCount + '/' + r.qty + ' In') : 'Not In';
    row.innerHTML =
      '<div class="row-head" onclick="toggleRow(' + r.id + ')">' +
        '<span class="row-chevron">▶</span>' +
        '<div class="row-main">' +
          '<div class="row-line1">' +
            '<span class="day-pill ' + dayClass(r.days) + '">' + dayPillText(r.days) + '</span>' +
            '<span class="row-name">' + escapeHtml(r.name) + '</span>' +
            '<span class="gift-badge' + (r.giftGiven ? '' : ' pending') + '" title="' + (r.giftGiven ? 'Gift given' : 'Gift not given yet') + '">🎁</span>' +
            '<span class="row-badge ' + rs.checkInStatus + '">' + badgeText + '</span>' +
          '</div>' +
          '<div class="row-line2">' +
            dotsHtml(rs.checkedInCount, r.qty) +
            '<span>' + rs.checkedInCount + ' of ' + r.qty + ' people — ' + (currentDay === 'saturday' ? 'Sat' : 'Sun') + '</span>' +
            payBadgeHtml(r.paymentSource) +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="row-detail" id="detail-' + r.id + '"></div>';
    listEl.appendChild(row);
  });

  if (openRowId !== null && filtered.some(function(r) { return r.id === openRowId; })) {
    renderOpenRowDetail(openRowId);
  }
}

document.getElementById('searchInput').addEventListener('input', renderRoster);

function toggleRow(id) {
  if (openRowId === id) {
    openRowId = null;
    renderRoster();
    return;
  }
  openRowId = id;
  delete detailCache[cacheKey(id, currentDay)]; // explicit (re)open always fetches fresh server truth
  renderRoster();
  var el = document.querySelector('.row[data-id="' + id + '"]');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Renders the open row's detail panel from cache when available (preserves in-progress
// checkbox edits across background re-renders); fetches fresh from the server otherwise.
// Always scoped to currentDay — tab switches close any open row (see selectDay), so the
// cache can never be read under the wrong day.
function renderOpenRowDetail(id) {
  var detailEl = document.getElementById('detail-' + id);
  if (!detailEl) return;
  var key = cacheKey(id, currentDay);
  if (detailCache[key]) {
    detailEl.innerHTML = renderDetailHtml(detailCache[key]);
    return;
  }
  detailEl.innerHTML = '<div class="loading">Loading ticket details…</div>';
  apiCall('lookup', { manualId: id, day: currentDay }).then(function(d) {
    if (d.err) {
      detailEl.innerHTML = '<div class="loading">' + escapeHtml(d.err) + '</div>';
      return;
    }
    detailCache[key] = d.registration;
    if (openRowId === id) detailEl.innerHTML = renderDetailHtml(d.registration); // still open? (user may have closed it while this was in flight)
  });
}

function renderDetailHtml(reg) {
  if (!reg.isPaid) {
    return (
      '<div class="detail-card">' +
        '<span class="detail-status problem">Not paid — do not admit</span>' +
      '</div>'
    );
  }

  var statusLabel = reg.checkInStatus === 'full' ? '✓ Everyone checked in' :
                     reg.checkInStatus === 'partial' ? (reg.checkedInCount + ' of ' + reg.qty + ' checked in') :
                     'Nobody checked in yet';

  var checkRows = (reg.attendees || []).map(function(a, i) {
    return (
      '<label class="attendee-check-row">' +
        '<input type="checkbox" data-idx="' + i + '" ' + (a.checkedIn ? 'checked' : '') + '>' +
        '<span class="ac-name">' + escapeHtml(a.name) + '</span>' +
        '<span class="ac-food">' + escapeHtml(a.food) + '</span>' +
      '</label>'
    );
  }).join('');

  var checkinDayLabel = reg.checkinDay === 'sunday' ? 'Sunday, Oct 18' : 'Saturday, Oct 17';
  return (
    '<div class="detail-card">' +
      '<div class="checkin-day-note">Checking in for ' + checkinDayLabel + '</div>' +
      '<div class="detail-head">' +
        '<span class="day-pill ' + dayClass(reg.days) + '">' + dayPillText(reg.days) + '</span>' +
        '<span class="detail-status ' + reg.checkInStatus + '">' + statusLabel + '</span>' +
        payBadgeHtml(reg.paymentSource) +
      '</div>' +
      dotsHtml(reg.checkedInCount, reg.qty) +
      '<div class="result-row"><span>Days Purchased</span><b>' + escapeHtml(reg.days) + '</b></div>' +
      '<div class="result-row"><span>Paid Via</span><b>' + escapeHtml(reg.paymentSource) + '</b></div>' +
      '<div class="result-row"><span>Pass Type</span><b>' + escapeHtml(reg.passType) + '</b></div>' +
      '<div class="result-row"><span>Total Paid</span><b>$' + reg.total + '</b></div>' +
      '<div class="attendee-check-list" id="checks-' + reg.id + '">' + checkRows + '</div>' +
      '<div class="detail-actions">' +
        '<button class="btn-cancel" onclick="toggleRow(' + reg.id + ')">Close</button>' +
        '<button class="btn-confirm" onclick="saveCheckin(' + reg.id + ')">✓ Save Check-In</button>' +
      '</div>' +
      giftSectionHtml(reg) +
    '</div>'
  );
}

// 15th-anniversary gift — ONE per registration, shared across both days on purpose (opposite
// of the per-day check-in above it): give it Saturday and it shows already-given on Sunday too.
function giftSectionHtml(reg) {
  var meta = '';
  if (reg.giftGiven && reg.giftGivenAt) {
    var d = reg.giftGivenDay === 'sunday' ? 'Sun' : 'Sat';
    meta = '<div class="gift-meta">Given ' + d + ' by ' + escapeHtml(reg.giftGivenBy || 'volunteer') + '</div>';
  }
  return (
    '<div class="gift-section">' +
      '<div class="gift-head">🎁 15th Anniversary Gift</div>' +
      '<div class="gift-sub">One per registration — shared across Saturday &amp; Sunday</div>' +
      '<button type="button" class="gift-btn' + (reg.giftGiven ? ' given' : '') + '" onclick="toggleGift(' + reg.id + ', ' + (!reg.giftGiven) + ')">' +
        (reg.giftGiven ? '✓ Gift Given — tap to undo' : 'Mark Gift Given') +
      '</button>' +
      meta +
    '</div>'
  );
}

function toggleGift(id, given) {
  var station = document.getElementById('stationName').value.trim() || 'Front Gate';
  apiCall('giftConfirm', { manualId: id, day: currentDay, station: station, given: given }).then(function(d) {
    if (d.err) { showError(d.err); return; }
    var key = cacheKey(id, currentDay);
    if (detailCache[key]) detailCache[key].giftGiven = d.registration.giftGiven;
    if (detailCache[key]) { detailCache[key].giftGivenAt = d.registration.giftGivenAt; detailCache[key].giftGivenBy = d.registration.giftGivenBy; detailCache[key].giftGivenDay = d.registration.giftGivenDay; }
    var i = roster.findIndex(function(r) { return r.id === id; });
    if (i !== -1) roster[i].giftGiven = d.registration.giftGiven;
    showSuccess(d.registration.giftGiven ? '🎁 Gift marked given for ' + d.registration.name : '🎁 Gift mark undone for ' + d.registration.name);
    renderRoster();
  });
}

function saveCheckin(id) {
  var container = document.getElementById('checks-' + id);
  var boxes = container.querySelectorAll('input[type=checkbox]');
  var present = [];
  boxes.forEach(function(b) { present[parseInt(b.dataset.idx, 10)] = b.checked; });

  var station = document.getElementById('stationName').value.trim() || 'Front Gate';
  apiCall('confirm', { manualId: id, station: station, present: present, day: currentDay }).then(function(d) {
    if (d.err) { showError(d.err); return; }
    detailCache[cacheKey(id, currentDay)] = d.registration; // post-save server truth, not what the user merely clicked
    var i = roster.findIndex(function(r) { return r.id === id; });
    if (i !== -1) { roster[i][dayKey(currentDay)] = { checkedInCount: d.registration.checkedInCount, checkInStatus: d.registration.checkInStatus }; }
    var inCount = d.registration.checkedInCount;
    var dayName = currentDay === 'saturday' ? 'Saturday' : 'Sunday';
    showSuccess('✓ Saved (' + dayName + '): ' + d.registration.name + ' — ' + inCount + ' of ' + d.registration.qty + ' checked in');
    refreshStats();
    updateDayTabStats();
    renderRoster();
  });
}

// ── Manual ID fallback (inside camera panel) ─────────────────────────────────
function manualLookup() {
  var idVal = document.getElementById('manualIdInput').value;
  if (!idVal) return;
  var id = parseInt(idVal, 10);
  document.getElementById('manualIdInput').value = '';
  openRowId = id;
  delete detailCache[cacheKey(id, currentDay)]; // always want fresh server truth on an explicit open
  if (!roster.some(function(r) { return r.id === id; })) {
    apiCall('lookup', { manualId: id, day: currentDay }).then(function(d) {
      if (d.err) { showError(d.err); return; }
      var reg = d.registration;
      detailCache[cacheKey(id, currentDay)] = reg;
      var stub = { id: reg.id, name: reg.name, qty: reg.qty, days: reg.days, giftGiven: reg.giftGiven, paymentSource: reg.paymentSource,
                   sat: { checkedInCount: 0, checkInStatus: 'none' },
                   sun: { checkedInCount: 0, checkInStatus: 'none' } };
      stub[dayKey(currentDay)] = { checkedInCount: reg.checkedInCount, checkInStatus: reg.checkInStatus };
      roster.unshift(stub);
      updateDayTabStats();
      renderRoster();
      loadRoster(); // true up the other day's count from the server in the background
    });
    return;
  }
  document.getElementById('searchInput').value = '';
  renderRoster();
}

// ── QR camera (on-demand) ────────────────────────────────────────────────────
var videoEl, canvasEl, canvasCtx, scanning = false, stream = null, lastScannedToken = null;

function toggleCamera() {
  var panel = document.getElementById('cameraPanel');
  var btn = document.getElementById('qrToggleBtn');
  if (panel.classList.contains('show')) {
    panel.classList.remove('show');
    btn.classList.remove('active');
    btn.textContent = '📷 Scan QR';
    stopScanning();
  } else {
    panel.classList.add('show');
    btn.classList.add('active');
    btn.textContent = '✕ Stop Scan';
    startCamera();
  }
}

function startCamera() {
  videoEl = document.getElementById('video');
  canvasEl = document.getElementById('canvas');
  canvasCtx = canvasEl.getContext('2d', { willReadFrequently: true });

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCameraMessage('Camera not available on this browser. Use manual entry below instead.');
    return;
  }

  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } })
    .then(function(s) {
      stream = s;
      videoEl.srcObject = s;
      videoEl.onloadedmetadata = function() {
        videoEl.play();
        scanning = true;
        requestAnimationFrame(scanLoop);
      };
    })
    .catch(function(err) {
      showCameraMessage('Camera access denied or unavailable (' + err.name + '). Use manual entry below instead.');
    });
}

function stopScanning() {
  scanning = false;
  if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
  document.getElementById('cameraMsg').style.display = 'none';
  document.getElementById('scanBox').style.display = 'block';
}

function showCameraMessage(msg) {
  var el = document.getElementById('cameraMsg');
  el.textContent = msg;
  el.style.display = 'flex';
  document.getElementById('scanBox').style.display = 'none';
}

function scanLoop() {
  if (!scanning) return;
  if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA && videoEl.videoWidth > 0) {
    canvasEl.width = videoEl.videoWidth;
    canvasEl.height = videoEl.videoHeight;
    canvasCtx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
    var imageData = canvasCtx.getImageData(0, 0, canvasEl.width, canvasEl.height);
    var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
    if (code && code.data && code.data !== lastScannedToken) {
      lastScannedToken = code.data;
      handleScanned(code.data);
    }
  }
  requestAnimationFrame(scanLoop);
}

function handleScanned(token) {
  apiCall('lookup', { token: token, day: currentDay }).then(function(d) {
    if (d.err) {
      showError(d.err);
      setTimeout(function() { lastScannedToken = null; }, 2000);
      return;
    }
    var reg = d.registration;
    detailCache[cacheKey(reg.id, currentDay)] = reg;
    if (!roster.some(function(r) { return r.id === reg.id; })) {
      var stub = { id: reg.id, name: reg.name, qty: reg.qty, days: reg.days, giftGiven: reg.giftGiven, paymentSource: reg.paymentSource,
                   sat: { checkedInCount: 0, checkInStatus: 'none' },
                   sun: { checkedInCount: 0, checkInStatus: 'none' } };
      stub[dayKey(currentDay)] = { checkedInCount: reg.checkedInCount, checkInStatus: reg.checkInStatus };
      roster.unshift(stub);
      updateDayTabStats();
      loadRoster(); // true up the other day's count from the server in the background
    }
    toggleCamera(); // close scanner
    document.getElementById('searchInput').value = '';
    openRowId = reg.id;
    renderRoster();
    setTimeout(function() { lastScannedToken = null; }, 2000);
  });
}

function showError(msg) {
  var el = document.getElementById('errorBanner');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 3000);
}
function showSuccess(msg) {
  var el = document.getElementById('successFlash');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 3000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function() {
  var savedStation = sessionStorage.getItem('checkin_station');
  if (savedStation) document.getElementById('stationName').value = savedStation;
  document.getElementById('stationName').addEventListener('input', function() {
    sessionStorage.setItem('checkin_station', this.value);
  });

  // Default to whichever event day it actually is; Saturday otherwise.
  var today = new Date();
  var initialDay = (today.getMonth() === 9 && today.getDate() === 18) ? 'sunday' : 'saturday';
  selectDay(initialDay); // also triggers the first refreshStats()

  loadRoster();
  setInterval(refreshStats, 15000);
  setInterval(loadRoster, 30000);
})();
</script>
