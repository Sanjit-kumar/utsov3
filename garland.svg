<svg xmlns="http://www.w3.org/2000/svg" width="120" height="62" viewBox="0 0 120 62">
  <!-- Hanging string / thread -->
  <path d="M0 10 Q60 19 120 10" stroke="#6D4C41" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Vertical thread from string to flower -->
  <line x1="60" y1="14" x2="60" y2="23" stroke="#6D4C41" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Green leaves at attachment point -->
  <ellipse cx="51" cy="12" rx="9" ry="2.8" fill="#388E3C" opacity="0.85" transform="rotate(-22,51,12)"/>
  <ellipse cx="69" cy="12" rx="9" ry="2.8" fill="#388E3C" opacity="0.85" transform="rotate(22,69,12)"/>
  <!-- Marigold flower centered at (60, 37) — 12 petals -->
  <g transform="translate(60,37)">
    <ellipse rx="3.5" ry="7.5" fill="#FFA000" transform="rotate(0) translate(0,-11)"/>
    <ellipse rx="3.5" ry="7.5" fill="#FF8F00" transform="rotate(30) translate(0,-11)"/>
    <ellipse rx="3.5" ry="7.5" fill="#FFB300" transform="rotate(60) translate(0,-11)"/>
    <ellipse rx="3.5" ry="7.5" fill="#FFA000" transform="rotate(90) translate(0,-11)"/>
    <ellipse rx="3.5" ry="7.5" fill="#FF8F00" transform="rotate(120) translate(0,-11)"/>
    <ellipse rx="3.5" ry="7.5" fill="#FFB300" transform="rotate(150) translate(0,-11)"/>
    <ellipse rx="3.5" ry="7.5" fill="#FFA000" transform="rotate(180) translate(0,-11)"/>
    <ellipse rx="3.5" ry="7.5" fill="#FF8F00" transform="rotate(210) translate(0,-11)"/>
    <ellipse rx="3.5" ry="7.5" fill="#FFB300" transform="rotate(240) translate(0,-11)"/>
    <ellipse rx="3.5" ry="7.5" fill="#FFA000" transform="rotate(270) translate(0,-11)"/>
    <ellipse rx="3.5" ry="7.5" fill="#FF8F00" transform="rotate(300) translate(0,-11)"/>
    <ellipse rx="3.5" ry="7.5" fill="#FFB300" transform="rotate(330) translate(0,-11)"/>
    <!-- Dark center -->
    <circle r="6.5" fill="#BF360C"/>
    <circle r="3.8" fill="#E64A19"/>
    <circle r="1.8" fill="#FFAB40" opacity="0.7"/>
  </g>
  <!-- Tiny buds at either side of string (decorative) -->
  <circle cx="20" cy="12" r="3.5" fill="#FF8F00" opacity="0.6"/>
  <circle cx="20" cy="12" r="2" fill="#BF360C" opacity="0.7"/>
  <circle cx="100" cy="12" r="3.5" fill="#FF8F00" opacity="0.6"/>
  <circle cx="100" cy="12" r="2" fill="#BF360C" opacity="0.7"/>
  <!-- Leaf buds -->
  <ellipse cx="20" cy="10" rx="4" ry="1.8" fill="#4CAF50" opacity="0.6" transform="rotate(-15,20,10)"/>
  <ellipse cx="100" cy="10" rx="4" ry="1.8" fill="#4CAF50" opacity="0.6" transform="rotate(15,100,10)"/>
</svg>
