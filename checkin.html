<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>UTSOV 2026 — Door Check-In</title>
<meta name="robots" content="noindex, nofollow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red-dark:#6B0E0E;--red:#9E2424;--cream:#FFFDF8;--ivory:#FFF0E5;
  --green:#1F8A3B;--green-bg:#E7F6EC;--amber:#B8860B;--amber-bg:#FFF6E0;
  --on-cream:#1A0000;--line:#eadbd0;
}
body{font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--on-cream);min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

header{background:var(--red-dark);color:#fff;padding:.8rem 1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;position:sticky;top:0;z-index:20}
header .title{font-weight:700;font-size:1rem}
header .stats{font-size:.76rem;opacity:.95;text-align:right;line-height:1.3}

.day-tabs{display:flex;background:var(--red-dark);padding:0 1rem .6rem;gap:.4rem;position:sticky;top:48px;z-index:20}
.day-tab{flex:1;padding:.55rem;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:rgba(255,255,255,.85);border-radius:8px;font-weight:700;font-size:.85rem}
.day-tab.active{background:#fff;color:var(--red-dark);border-color:#fff}

.station-bar{background:var(--ivory);padding:.6rem 1rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.station-bar label{font-size:.8rem;font-weight:600}
.station-bar input{padding:.4rem .6rem;border:1px solid #ccc;border-radius:6px;font-size:.85rem;flex:1;min-width:140px}

.toolbar{display:flex;gap:.6rem;padding:.8rem 1rem;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:98px;z-index:19;flex-wrap:wrap}
#searchInput{flex:1;min-width:160px;padding:.7rem .9rem;border:1.5px solid #ccc;border-radius:10px;font-size:1rem}
#searchInput:focus{outline:2px solid var(--red-dark);border-color:var(--red-dark)}
#qrToggleBtn{padding:.7rem 1rem;background:var(--red-dark);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:.9rem;white-space:nowrap}
#qrToggleBtn.active{background:var(--amber)}

main{flex:1;max-width:640px;margin:0 auto;width:100%;padding:0 1rem 2rem}

/* Camera panel — shown only while scanning */
#cameraPanel{display:none;padding-top:1rem}
#cameraPanel.show{display:block}
.camera-wrap{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;max-width:380px;margin:0 auto}
.camera-wrap video{width:100%;height:100%;object-fit:cover}
.camera-wrap .scan-box{position:absolute;top:15%;left:15%;right:15%;bottom:15%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
.camera-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:1rem;font-size:.9rem;background:rgba(0,0,0,.6)}
.camera-close{display:block;margin:.6rem auto 0;padding:.5rem 1.1rem;background:#eee;border:none;border-radius:8px;font-size:.85rem;font-weight:600}

.manual-row{display:flex;gap:.5rem;padding:.7rem 0 0}
.manual-row input{flex:1;padding:.6rem;border:1.5px solid #ccc;border-radius:8px;font-size:.95rem}
.manual-row button{padding:.6rem 1rem;background:#eee;color:#333;border:none;border-radius:8px;font-weight:700;font-size:.85rem}

.error-banner{display:none;background:#FFF0F0;border:2px solid var(--red);color:var(--red-dark);padding:.8rem;border-radius:10px;font-size:.9rem;text-align:center;margin-top:.8rem}
.error-banner.show{display:block}
.success-flash{display:none;background:var(--green-bg);border:2px solid var(--green);color:var(--green);padding:.9rem;border-radius:10px;text-align:center;font-weight:700;margin-top:.8rem}
.success-flash.show{display:block}

.list-count{font-size:.78rem;color:#888;padding:.8rem 0 .4rem}

/* Roster rows */
.roster{display:flex;flex-direction:column;gap:.5rem;padding-bottom:1rem}
.row{background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.row.status-full{border-color:var(--green)}
.row.status-partial{border-color:var(--amber)}
.row-head{display:flex;align-items:center;gap:.6rem;padding:.75rem .9rem;cursor:pointer}
.row-name{flex:1;font-weight:700;font-size:.95rem}
.row-meta{font-size:.78rem;color:#888;white-space:nowrap}
.row-badge{font-size:.66rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:.25rem .55rem;border-radius:999px;white-space:nowrap}
.row-badge.none{background:#eee;color:#777}
.row-badge.partial{background:var(--amber-bg);color:var(--amber)}
.row-badge.full{background:var(--green);color:#fff}
.row-chevron{color:#bbb;font-size:.8rem;transition:transform .15s}
.row.open .row-chevron{transform:rotate(90deg)}

.row-detail{display:none;padding:0 .9rem .9rem;border-top:1px solid var(--line)}
.row.open .row-detail{display:block}
.row-detail .loading{padding:.8rem 0;font-size:.85rem;color:#999;text-align:center}
.detail-card{padding-top:.7rem}
.result-row{font-size:.9rem;margin:.3rem 0;display:flex;justify-content:space-between;gap:.5rem}
.result-row b{font-weight:600}
.detail-status{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:.3rem .6rem;border-radius:8px;display:inline-block;margin-bottom:.5rem}
.detail-status.full{background:var(--green-bg);color:var(--green)}
.detail-status.partial{background:var(--amber-bg);color:var(--amber)}
.detail-status.none{background:#eee;color:#777}
.detail-status.problem{background:#FFF0F0;color:var(--red)}

.attendee-check-list{margin-top:.7rem;padding-top:.6rem;border-top:1px solid rgba(0,0,0,.08)}
.attendee-check-row{display:flex;align-items:center;gap:.6rem;padding:.5rem .2rem;border-radius:8px}
.attendee-check-row:active{background:#f6f6f6}
.attendee-check-row input[type=checkbox]{width:22px;height:22px;flex-shrink:0;accent-color:var(--green)}
.attendee-check-row .ac-name{flex:1;font-size:.9rem;font-weight:600}
.attendee-check-row .ac-food{font-size:.76rem;color:#888}

.detail-actions{display:flex;gap:.6rem;margin-top:.9rem}
.detail-actions button{flex:1;padding:.75rem;border:none;border-radius:8px;font-weight:700;font-size:.92rem}
.btn-confirm{background:var(--green);color:#fff}
.btn-confirm:disabled{background:#aaa;cursor:not-allowed}
.btn-cancel{background:#eee;color:#333}

.empty-state{text-align:center;color:#999;padding:2rem 0;font-size:.9rem}
</style>
</head>
<body>

<header>
  <div class="title">🎟 UTSOV Door Check-In</div>
  <div class="stats" id="statsLine">Loading…</div>
</header>

<div class="day-tabs">
  <button class="day-tab" id="tabSaturday" onclick="selectDay('saturday')">Saturday, Oct 17</button>
  <button class="day-tab" id="tabSunday" onclick="selectDay('sunday')">Sunday, Oct 18</button>
</div>

<div class="station-bar">
  <label for="stationName">Gate / Volunteer:</label>
  <input type="text" id="stationName" placeholder="e.g. Front Gate - Ranjan" maxlength="100">
</div>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="🔍 Search by name…" autocomplete="off">
  <button id="qrToggleBtn" type="button" onclick="toggleCamera()">📷 Scan QR</button>
</div>

<main>
  <div id="cameraPanel">
    <div class="camera-wrap" id="cameraWrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="scan-box" id="scanBox"></div>
      <div class="camera-msg" id="cameraMsg" style="display:none"></div>
    </div>
    <canvas id="canvas" style="display:none"></canvas>
    <button class="camera-close" onclick="toggleCamera()">✕ Close Scanner</button>

    <div class="manual-row">
      <input type="number" id="manualIdInput" placeholder="Can't scan? Enter registration ID" min="1">
      <button onclick="manualLookup()">Look Up</button>
    </div>
  </div>

  <div class="error-banner" id="errorBanner"></div>
  <div class="success-flash" id="successFlash"></div>

  <div class="list-count" id="listCount"></div>
  <div class="roster" id="rosterList"></div>
  <div class="empty-state" id="emptyState" hidden>No matching registrations.</div>
</main>

<script src="js/jsQR.js"></script>
<script>
// ── API helper ────────────────────────────────────────────────────────────────
function apiCall(action, extra) {
  var body = Object.assign({ action: action }, extra || {});
  return fetch('api/checkin.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r) { return r.json(); }).catch(function() {
    return { err: 'Network error — check connection and try again.' };
  });
}

function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ── Day tab state ─────────────────────────────────────────────────────────────
// A "Both Days" registration appears on BOTH tabs — check-in state is shared across both
// (there's one list of attendees, not separate Saturday/Sunday rosters per person), so if
// someone's marked present on Saturday they'll still show as present when you flip to Sunday.
var currentDay = 'saturday';

function selectDay(day) {
  currentDay = day;
  document.getElementById('tabSaturday').classList.toggle('active', day === 'saturday');
  document.getElementById('tabSunday').classList.toggle('active', day === 'sunday');
  renderRoster();
}

function rosterMatchesDay(r) {
  return r.days === 'Both Days' || r.days === (currentDay === 'saturday' ? 'Saturday' : 'Sunday');
}

// ── Roster state ──────────────────────────────────────────────────────────────
var roster = [];        // full list from server: {id, name, qty, days, checkedInCount, checkInStatus}
var openRowId = null;   // currently expanded registration id

function loadRoster() {
  return apiCall('roster', {}).then(function(d) {
    if (d.err) return;
    roster = d.roster || [];
    renderRoster();
  });
}

function refreshStats() {
  apiCall('list', {}).then(function(d) {
    if (d.err) return;
    document.getElementById('statsLine').textContent =
      d.fullyCheckedIn + ' fully in · ' + d.partiallyCheckedIn + ' partial · ' +
      d.checkedInHeadcount + ' / ' + d.totalHeadcount + ' people';
  });
}

// Cache of the last-known full registration object per id, keyed by id. Kept in sync with
// any unsaved checkbox edits the volunteer has made in the currently-open row, so a
// background poll (loadRoster every 30s) can rebuild the list without silently discarding
// ticks nobody has hit "Save Check-In" on yet.
var detailCache = {};

function captureOpenRowEdits() {
  if (openRowId === null || !detailCache[openRowId]) return;
  var container = document.getElementById('checks-' + openRowId);
  if (!container) return;
  var boxes = container.querySelectorAll('input[type=checkbox]');
  boxes.forEach(function(b) {
    var idx = parseInt(b.dataset.idx, 10);
    if (detailCache[openRowId].attendees[idx]) {
      detailCache[openRowId].attendees[idx].checkedIn = b.checked;
    }
  });
}

function renderRoster() {
  captureOpenRowEdits(); // preserve any unsaved ticks before the DOM gets rebuilt below

  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var dayFiltered = roster.filter(rosterMatchesDay);
  var filtered = q ? dayFiltered.filter(function(r) { return r.name.toLowerCase().indexOf(q) !== -1; }) : dayFiltered;

  var listEl = document.getElementById('rosterList');
  var emptyEl = document.getElementById('emptyState');
  var countEl = document.getElementById('listCount');

  countEl.textContent = (q ? (filtered.length + ' match' + (filtered.length === 1 ? '' : 'es')) : (filtered.length + ' registrations')) +
    ' — ' + (currentDay === 'saturday' ? 'Saturday, Oct 17' : 'Sunday, Oct 18');
  emptyEl.hidden = filtered.length > 0;
  listEl.innerHTML = '';

  filtered.forEach(function(r) {
    var row = document.createElement('div');
    row.className = 'row status-' + r.checkInStatus + (openRowId === r.id ? ' open' : '');
    row.dataset.id = r.id;
    var badgeText = r.checkInStatus === 'full' ? '✓ All In' : r.checkInStatus === 'partial' ? (r.checkedInCount + '/' + r.qty + ' In') : 'Not In';
    row.innerHTML =
      '<div class="row-head" onclick="toggleRow(' + r.id + ')">' +
        '<span class="row-chevron">▶</span>' +
        '<span class="row-name">' + escapeHtml(r.name) + '</span>' +
        '<span class="row-meta">' + r.qty + 'p · ' + escapeHtml(r.days) + '</span>' +
        '<span class="row-badge ' + r.checkInStatus + '">' + badgeText + '</span>' +
      '</div>' +
      '<div class="row-detail" id="detail-' + r.id + '"></div>';
    listEl.appendChild(row);
  });

  if (openRowId !== null && filtered.some(function(r) { return r.id === openRowId; })) {
    renderOpenRowDetail(openRowId);
  }
}

document.getElementById('searchInput').addEventListener('input', renderRoster);

function toggleRow(id) {
  if (openRowId === id) {
    openRowId = null;
    renderRoster();
    return;
  }
  openRowId = id;
  delete detailCache[id]; // explicit (re)open always fetches fresh server truth
  renderRoster();
  var el = document.querySelector('.row[data-id="' + id + '"]');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Renders the open row's detail panel from cache when available (preserves in-progress
// checkbox edits across background re-renders); fetches fresh from the server otherwise.
function renderOpenRowDetail(id) {
  var detailEl = document.getElementById('detail-' + id);
  if (!detailEl) return;
  if (detailCache[id]) {
    detailEl.innerHTML = renderDetailHtml(detailCache[id]);
    return;
  }
  detailEl.innerHTML = '<div class="loading">Loading ticket details…</div>';
  apiCall('lookup', { manualId: id }).then(function(d) {
    if (d.err) {
      detailEl.innerHTML = '<div class="loading">' + escapeHtml(d.err) + '</div>';
      return;
    }
    detailCache[id] = d.registration;
    if (openRowId === id) detailEl.innerHTML = renderDetailHtml(d.registration); // still open? (user may have closed it while this was in flight)
}

function renderDetailHtml(reg) {
  if (!reg.isPaid) {
    return (
      '<div class="detail-card">' +
        '<span class="detail-status problem">Not paid — do not admit</span>' +
      '</div>'
    );
  }

  var statusLabel = reg.checkInStatus === 'full' ? '✓ Everyone checked in' :
                     reg.checkInStatus === 'partial' ? (reg.checkedInCount + ' of ' + reg.qty + ' checked in') :
                     'Nobody checked in yet';

  var checkRows = (reg.attendees || []).map(function(a, i) {
    return (
      '<label class="attendee-check-row">' +
        '<input type="checkbox" data-idx="' + i + '" ' + (a.checkedIn ? 'checked' : '') + '>' +
        '<span class="ac-name">' + escapeHtml(a.name) + '</span>' +
        '<span class="ac-food">' + escapeHtml(a.food) + '</span>' +
      '</label>'
    );
  }).join('');

  return (
    '<div class="detail-card">' +
      '<span class="detail-status ' + reg.checkInStatus + '">' + statusLabel + '</span>' +
      '<div class="result-row"><span>Days</span><b>' + escapeHtml(reg.days) + '</b></div>' +
      '<div class="result-row"><span>Pass Type</span><b>' + escapeHtml(reg.passType) + '</b></div>' +
      '<div class="result-row"><span>Total Paid</span><b>$' + reg.total + '</b></div>' +
      '<div class="attendee-check-list" id="checks-' + reg.id + '">' + checkRows + '</div>' +
      '<div class="detail-actions">' +
        '<button class="btn-cancel" onclick="toggleRow(' + reg.id + ')">Close</button>' +
        '<button class="btn-confirm" onclick="saveCheckin(' + reg.id + ')">✓ Save Check-In</button>' +
      '</div>' +
    '</div>'
  );
}

function saveCheckin(id) {
  var container = document.getElementById('checks-' + id);
  var boxes = container.querySelectorAll('input[type=checkbox]');
  var present = [];
  boxes.forEach(function(b) { present[parseInt(b.dataset.idx, 10)] = b.checked; });

  var station = document.getElementById('stationName').value.trim() || 'Front Gate';
  apiCall('confirm', { manualId: id, station: station, present: present }).then(function(d) {
    if (d.err) { showError(d.err); return; }
    detailCache[id] = d.registration; // post-save server truth, not what the user merely clicked
    var i = roster.findIndex(function(r) { return r.id === id; });
    if (i !== -1) { roster[i].checkedInCount = d.registration.checkedInCount; roster[i].checkInStatus = d.registration.checkInStatus; }
    var inCount = d.registration.checkedInCount;
    showSuccess('✓ Saved: ' + d.registration.name + ' — ' + inCount + ' of ' + d.registration.qty + ' checked in');
    refreshStats();
    renderRoster();
  });
}

// ── Manual ID fallback (inside camera panel) ─────────────────────────────────
function manualLookup() {
  var idVal = document.getElementById('manualIdInput').value;
  if (!idVal) return;
  var id = parseInt(idVal, 10);
  document.getElementById('manualIdInput').value = '';
  openRowId = id;
  delete detailCache[id]; // always want fresh server truth on an explicit open
  if (!roster.some(function(r) { return r.id === id; })) {
    apiCall('lookup', { manualId: id }).then(function(d) {
      if (d.err) { showError(d.err); return; }
      var reg = d.registration;
      detailCache[id] = reg;
      roster.unshift({ id: reg.id, name: reg.name, qty: reg.qty, days: reg.days, checkedInCount: reg.checkedInCount, checkInStatus: reg.checkInStatus });
      renderRoster();
    });
    return;
  }
  document.getElementById('searchInput').value = '';
  renderRoster();
}

// ── QR camera (on-demand) ────────────────────────────────────────────────────
var videoEl, canvasEl, canvasCtx, scanning = false, stream = null, lastScannedToken = null;

function toggleCamera() {
  var panel = document.getElementById('cameraPanel');
  var btn = document.getElementById('qrToggleBtn');
  if (panel.classList.contains('show')) {
    panel.classList.remove('show');
    btn.classList.remove('active');
    btn.textContent = '📷 Scan QR';
    stopScanning();
  } else {
    panel.classList.add('show');
    btn.classList.add('active');
    btn.textContent = '✕ Stop Scan';
    startCamera();
  }
}

function startCamera() {
  videoEl = document.getElementById('video');
  canvasEl = document.getElementById('canvas');
  canvasCtx = canvasEl.getContext('2d', { willReadFrequently: true });

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCameraMessage('Camera not available on this browser. Use manual entry below instead.');
    return;
  }

  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } })
    .then(function(s) {
      stream = s;
      videoEl.srcObject = s;
      videoEl.onloadedmetadata = function() {
        videoEl.play();
        scanning = true;
        requestAnimationFrame(scanLoop);
      };
    })
    .catch(function(err) {
      showCameraMessage('Camera access denied or unavailable (' + err.name + '). Use manual entry below instead.');
    });
}

function stopScanning() {
  scanning = false;
  if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
  document.getElementById('cameraMsg').style.display = 'none';
  document.getElementById('scanBox').style.display = 'block';
}

function showCameraMessage(msg) {
  var el = document.getElementById('cameraMsg');
  el.textContent = msg;
  el.style.display = 'flex';
  document.getElementById('scanBox').style.display = 'none';
}

function scanLoop() {
  if (!scanning) return;
  if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA && videoEl.videoWidth > 0) {
    canvasEl.width = videoEl.videoWidth;
    canvasEl.height = videoEl.videoHeight;
    canvasCtx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
    var imageData = canvasCtx.getImageData(0, 0, canvasEl.width, canvasEl.height);
    var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
    if (code && code.data && code.data !== lastScannedToken) {
      lastScannedToken = code.data;
      handleScanned(code.data);
    }
  }
  requestAnimationFrame(scanLoop);
}

function handleScanned(token) {
  apiCall('lookup', { token: token }).then(function(d) {
    if (d.err) {
      showError(d.err);
      setTimeout(function() { lastScannedToken = null; }, 2000);
      return;
    }
    var reg = d.registration;
    detailCache[reg.id] = reg;
    if (!roster.some(function(r) { return r.id === reg.id; })) {
      roster.unshift({ id: reg.id, name: reg.name, qty: reg.qty, days: reg.days, checkedInCount: reg.checkedInCount, checkInStatus: reg.checkInStatus });
    }
    toggleCamera(); // close scanner
    document.getElementById('searchInput').value = '';
    openRowId = reg.id;
    renderRoster();
    setTimeout(function() { lastScannedToken = null; }, 2000);
  });
}

function showError(msg) {
  var el = document.getElementById('errorBanner');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 3000);
}
function showSuccess(msg) {
  var el = document.getElementById('successFlash');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 3000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function() {
  var savedStation = sessionStorage.getItem('checkin_station');
  if (savedStation) document.getElementById('stationName').value = savedStation;
  document.getElementById('stationName').addEventListener('input', function() {
    sessionStorage.setItem('checkin_station', this.value);
  });

  // Default to whichever event day it actually is; Saturday otherwise.
  var today = new Date();
  var initialDay = (today.getMonth() === 9 && today.getDate() === 18) ? 'sunday' : 'saturday';
  selectDay(initialDay);

  refreshStats();
  loadRoster();
  setInterval(refreshStats, 15000);
  setInterval(loadRoster, 30000);
})();
</script>
</body>
</html>
