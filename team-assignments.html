<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>UTSOV 2026 — Team Assignments</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=EB+Garamond:ital@0;1&family=Josefin+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --red-dark:#5C0000; --red:#8B1A1A; --gold:#C9A84C; --gold-lt:#E8C97A;
  --cream:#FFFDF8; --ink:#2A1000; --ink-soft:#6B5A4A; --border:#E8D9C0;
  --f-display:'Bebas Neue',sans-serif; --f-serif:'EB Garamond',serif; --f-label:'Josefin Sans',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-label);padding:0}

/* ===== Login screen ===== */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:radial-gradient(ellipse 100% 60% at 50% 0%,rgba(139,26,26,.08) 0%,transparent 60%)}
.login-card{background:#fff;border:2px solid var(--red-dark);border-radius:16px;padding:2.2rem 2rem;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(92,0,0,.15)}
.login-card h1{font-family:var(--f-display);font-size:1.8rem;color:var(--red-dark);letter-spacing:.04em;margin:0 0 .3rem;text-align:center}
.login-card p.sub{font-family:var(--f-serif);font-style:italic;color:var(--ink-soft);text-align:center;margin:0 0 1.4rem;font-size:.92rem}
.login-card label{display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:.9rem 0 .3rem;color:var(--ink-soft)}
.login-card input{width:100%;padding:.75rem .9rem;border:1.5px solid var(--border);border-radius:9px;font-size:1rem;font-family:var(--f-label)}
.login-card input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.login-card button{width:100%;margin-top:1.4rem;padding:.85rem;background:var(--red-dark);color:#fff;border:none;border-radius:9px;font-size:.95rem;font-weight:700;letter-spacing:.04em;cursor:pointer;font-family:var(--f-label)}
.login-card button:hover{background:var(--red)}
.login-err{color:var(--red);font-size:.82rem;margin-top:.7rem;display:none;text-align:center}
.login-err.show{display:block}
[hidden]{display:none!important}

/* ===== Main app ===== */
header.app-hdr{background:linear-gradient(135deg,var(--red-dark),var(--red));padding:1.5rem 1.25rem;text-align:center;border-bottom:4px solid var(--gold)}
header.app-hdr h1{font-family:var(--f-display);color:#fff;font-size:clamp(1.6rem,5vw,2.3rem);letter-spacing:.04em;margin:0}
header.app-hdr p{font-family:var(--f-serif);font-style:italic;color:var(--gold-lt);margin:.3rem 0 0;font-size:.95rem}

.wrap{max-width:900px;margin:0 auto;padding:1.5rem 1.25rem 3rem}

.find-box{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:1.2rem 1.3rem;margin-bottom:1.5rem;box-shadow:0 4px 18px rgba(92,0,0,.06)}
.find-box label{display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.5rem}
.find-box input{width:100%;padding:.75rem .9rem;border:1.5px solid var(--border);border-radius:9px;font-size:1rem;font-family:var(--f-label)}
.find-box input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
#findResults{margin-top:.8rem;display:flex;flex-direction:column;gap:.5rem}
.find-hit{background:var(--cream);border:1px solid var(--border);border-radius:9px;padding:.6rem .8rem;font-size:.88rem;cursor:pointer}
.find-hit:hover{border-color:var(--gold)}
.find-hit b{color:var(--red-dark)}
.find-empty{color:var(--ink-soft);font-size:.85rem;font-style:italic}

.picker{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:1.2rem 1.3rem;margin-bottom:1.5rem;box-shadow:0 4px 18px rgba(92,0,0,.06)}
.picker label{display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.5rem}
#teamSelect{width:100%;padding:.8rem .9rem;border:1.5px solid var(--border);border-radius:9px;font-size:1rem;font-family:var(--f-label);background:#fff;color:var(--ink)}
#teamSelect:focus{outline:2px solid var(--gold);border-color:var(--gold)}

#teamDisplay{display:none}
#teamDisplay.show{display:block}
.team-title{font-family:var(--f-display);font-size:1.7rem;color:var(--red-dark);letter-spacing:.03em;margin:0 0 .2rem;text-wrap:balance}
.team-resp{font-family:var(--f-serif);font-style:italic;color:var(--ink-soft);margin:0 0 .3rem;font-size:.95rem}
.team-contact{font-size:.8rem;color:var(--ink-soft);margin-bottom:1.1rem}
.team-contact b{color:var(--red)}

.days-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:620px){.days-grid{grid-template-columns:1fr}}
.day-col{background:#fff;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(92,0,0,.06)}
.day-head{background:var(--red-dark);color:#fff;padding:.7rem 1rem;font-family:var(--f-display);font-size:1.1rem;letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between}
.day-head .day-date{font-family:var(--f-label);font-size:.68rem;color:var(--gold-lt);font-weight:600}
.member-list{list-style:none;margin:0;padding:.4rem 0}
.member-list li{padding:.6rem 1rem;border-bottom:1px solid var(--border);font-size:.9rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.member-list li:last-child{border-bottom:none}
.member-list li .mname{font-weight:600}
.member-list li a{color:var(--red);text-decoration:none;font-size:.82rem;white-space:nowrap}
.member-list li a:hover{text-decoration:underline}
.same-note{text-align:center;font-size:.75rem;color:var(--ink-soft);font-style:italic;padding:.5rem 1rem 0}

footer{text-align:center;padding:1.5rem;font-size:.72rem;color:var(--ink-soft)}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>UTSOV 2026</h1>
    <p class="sub">Team Assignments — Internal Use Only</p>
    <label for="loginUser">Username</label>
    <input type="text" id="loginUser" autocomplete="username">
    <label for="loginPass">Password</label>
    <input type="password" id="loginPass" autocomplete="current-password">
    <button id="loginBtn" type="button">View Team Assignments</button>
    <div class="login-err" id="loginErr">Invalid username or password.</div>
  </div>
</div>

<div id="app" hidden>
  <header class="app-hdr">
    <h1>Team Assignments</h1>
    <p>UTSOV Durga Puja 2026 &middot; October 17&ndash;18</p>
  </header>

  <div class="wrap">
    <div class="find-box">
      <label for="findInput">Find Yourself — search your name</label>
      <input type="text" id="findInput" placeholder="Type your name…" autocomplete="off">
      <div id="findResults"></div>
    </div>

    <div class="picker">
      <label for="teamSelect">Or browse by team</label>
      <select id="teamSelect"></select>
    </div>

    <div id="teamDisplay">
      <h2 class="team-title" id="teamTitle"></h2>
      <p class="team-resp" id="teamResp" hidden></p>
      <p class="team-contact" id="teamContact" hidden></p>
      <div class="days-grid">
        <div class="day-col">
          <div class="day-head"><span>Saturday</span><span class="day-date">Oct 17</span></div>
          <ul class="member-list" id="satList"></ul>
        </div>
        <div class="day-col">
          <div class="day-head"><span>Sunday</span><span class="day-date">Oct 18</span></div>
          <ul class="member-list" id="sunList"></ul>
        </div>
      </div>
      <p class="same-note" id="sameNote" hidden>Same team serves both days.</p>
    </div>
  </div>

  <footer>UTSOV Inc. &middot; Internal page, not linked from the public site &middot; Updated 2026-10-04</footer>
</div>

<script>
(function(){
  var DATA = null;

  function esc(s){
    return (s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function telHref(phone){
    var digits = (phone || '').replace(/[^\d+]/g, '');
    return digits ? 'tel:' + digits : '';
  }

  function renderMemberList(ul, members){
    ul.innerHTML = '';
    if (!members || !members.length){
      var li = document.createElement('li');
      li.textContent = 'No one assigned yet.';
      ul.appendChild(li);
      return;
    }
    members.forEach(function(m){
      var li = document.createElement('li');
      var phoneHtml = m.phone ? '<a href="' + telHref(m.phone) + '">' + esc(m.phone) + '</a>' : '';
      li.innerHTML = '<span class="mname">' + esc(m.name) + '</span>' + phoneHtml;
      ul.appendChild(li);
    });
  }

  function sameRoster(a, b){
    if (!a || !b || a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++){
      if (a[i].name !== b[i].name || a[i].phone !== b[i].phone) return false;
    }
    return true;
  }

  function showTeam(teamName){
    var t = DATA.teams[teamName];
    if (!t) return;
    document.getElementById('teamTitle').textContent = teamName.trim();
    var respEl = document.getElementById('teamResp');
    if (t.responsibility){ respEl.textContent = t.responsibility; respEl.hidden = false; } else { respEl.hidden = true; }
    var contactEl = document.getElementById('teamContact');
    if (t.contact){ contactEl.innerHTML = '<b>Contact:</b> ' + esc(t.contact); contactEl.hidden = false; } else { contactEl.hidden = true; }
    renderMemberList(document.getElementById('satList'), t.sat);
    renderMemberList(document.getElementById('sunList'), t.sun);
    document.getElementById('sameNote').hidden = !sameRoster(t.sat, t.sun);
    document.getElementById('teamDisplay').classList.add('show');
    document.getElementById('teamSelect').value = teamName;
    document.getElementById('teamDisplay').scrollIntoView({behavior:'smooth', block:'start'});
  }

  function buildPicker(){
    var sel = document.getElementById('teamSelect');
    sel.innerHTML = '<option value="">Select a team…</option>';
    DATA.order.forEach(function(t){
      var o = document.createElement('option');
      o.value = t; o.textContent = t.trim() + ' (' + DATA.teams[t].sat.length + ')';
      sel.appendChild(o);
    });
    sel.addEventListener('change', function(){
      if (sel.value) showTeam(sel.value);
    });
  }

  function buildFind(){
    var input = document.getElementById('findInput');
    var results = document.getElementById('findResults');
    input.addEventListener('input', function(){
      var q = input.value.trim().toLowerCase();
      results.innerHTML = '';
      if (q.length < 2) return;
      var hits = [];
      DATA.order.forEach(function(t){
        var seen = {};
        DATA.teams[t].sat.forEach(function(m){
          if (m.name.toLowerCase().indexOf(q) !== -1 && !seen[m.name]){
            seen[m.name] = true;
            hits.push({team: t, name: m.name});
          }
        });
      });
      if (!hits.length){
        var d = document.createElement('div');
        d.className = 'find-empty';
        d.textContent = 'No match. Try a different spelling, or browse by team below.';
        results.appendChild(d);
        return;
      }
      hits.forEach(function(h){
        var d = document.createElement('div');
        d.className = 'find-hit';
        d.innerHTML = esc(h.name) + ' is on <b>' + esc(h.team.trim()) + '</b>';
        d.addEventListener('click', function(){ showTeam(h.team); });
        results.appendChild(d);
      });
    });
  }

  function init(data){
    DATA = data;
    buildPicker();
    buildFind();
  }

  document.getElementById('loginBtn').addEventListener('click', function(){
    var u = document.getElementById('loginUser').value.trim();
    var p = document.getElementById('loginPass').value;
    var btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Checking…';
    fetch('api/team-assignments-data.php', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p})
    }).then(function(r){ return r.json(); }).then(function(res){
      btn.disabled = false; btn.textContent = 'View Team Assignments';
      if (res.ok){
        document.getElementById('loginScreen').hidden = true;
        document.getElementById('app').hidden = false;
        init(res.data);
      } else {
        document.getElementById('loginErr').classList.add('show');
      }
    }).catch(function(){
      btn.disabled = false; btn.textContent = 'View Team Assignments';
      document.getElementById('loginErr').textContent = 'Something went wrong. Please try again.';
      document.getElementById('loginErr').classList.add('show');
    });
  });

  document.getElementById('loginPass').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });
})();
</script>
</body>
</html>
